name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Format (StyLua)
        run: stylua --check src tests maps tools

      - name: Lint (Selene)
        run: selene src

      - name: Strict type-check (luau-lsp)
        run: scripts/typecheck.sh

      - name: Syntax check + specs (Lune)
        run: lune run tests/run

      - name: Build place (Rojo)
        run: |
          mkdir -p build
          rojo build default.project.json --output build/JunkyardBrawl.rbxlx

      - name: Upload place file
        uses: actions/upload-artifact@v6
        with:
          name: JunkyardBrawl-place
          path: build/JunkyardBrawl.rbxlx
          retention-days: 14

  # Squash-merges green PRs opened from claude/* branches in this repo.
  # Opt out by marking the PR as draft or adding the "no-automerge" label.
  automerge:
    name: Auto-merge
    needs: checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA"
